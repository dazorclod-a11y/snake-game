<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Адаптив: поле подстраивается под ширину экрана телефона -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Змейка</title>

  <!-- PWA: манифест, цвет темы и иконка для установки на телефон -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16213e">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Змейка">

  <style>
    /* ===== Общие стили страницы ===== */
    :root {
      --bg: #1a1a2e;        /* фон страницы */
      --field: #16213e;     /* фон игрового поля */
      --grid: #0f3460;      /* линии сетки */
      --snake: #4ade80;     /* тело змейки */
      --snake-head: #22c55e;/* голова змейки */
      --food: #f43f5e;      /* еда */
      --text: #e5e7eb;      /* текст */
      --accent: #4ade80;    /* акцент (кнопка) */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
    }

    h1 { font-size: 1.4rem; letter-spacing: 1px; }

    /* Счёт */
    .score {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .score span { color: var(--accent); }
    /* Нарисованная монета (вместо эмодзи 🪙 — рендерится одинаково на всех ОС) */
    .coin-icon {
      display: inline-block;
      width: 0.95em;
      height: 0.95em;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe27a, #f5b301 70%, #c98a00);
      border: 1px solid #b37b00;
      vertical-align: -0.12em;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
    }

    /* ===== Обёртка поля =====
       Ширина ограничена, но не больше ширины экрана — это и есть адаптив.
       aspect-ratio: 1 держит поле квадратным. */
    .field-wrap {
      position: relative;
      /* Ограничиваем поле и по ширине, и по ВЫСОТЕ экрана (55vh),
         чтобы кнопки и бейдж всегда помещались без прокрутки. */
      width: min(92vw, 55vh, 480px);
      aspect-ratio: 1 / 1;
    }

    /* Сам холст растягивается на всю обёртку */
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--field);
      border: 2px solid var(--grid);
      border-radius: 8px;
      touch-action: none; /* чтобы свайпы не скроллили страницу */
    }

    /* ===== Экран Game Over (поверх поля) ===== */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(10, 10, 25, 0.85);
      border-radius: 8px;
      text-align: center;
    }
    .overlay.hidden { display: none; } /* по умолчанию скрыт */

    .overlay h2 { font-size: 1.8rem; color: var(--food); }
    .overlay .final-score { font-size: 1.2rem; }

    /* Вторичная кнопка «Поделиться» — тёмная, чтобы отличалась от зелёной «Начать заново» */
    button.btn-secondary {
      color: var(--text);
      background: var(--grid);
      border: 1px solid var(--field);
      font-size: 1rem;
      padding: 10px 20px;
    }
    button.btn-secondary:hover { filter: brightness(1.15); }

    /* Сообщение «Скопировано!» — появляется плавно, потом прячется */
    .share-msg {
      min-height: 1.1em;
      font-size: 0.9rem;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .share-msg.show { opacity: 1; }

    button {
      font-size: 1.1rem;
      font-weight: 600;
      color: #06210f;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.97); }

    /* ===== Крестовина экранных кнопок ===== */
    .dpad {
      display: grid;
      /* 3 колонки × 2 ряда клеток по 56px — форма крестовины */
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 8px;
      justify-content: center;
    }
    /* Раскладка: вверх — сверху по центру, влево/вниз/вправо — в нижнем ряду */
    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* Внешний вид кнопок крестовины (переопределяет базовый стиль button) */
    .dpad button {
      width: 56px;             /* крупные — удобно пальцу (> 48px) */
      height: 56px;
      min-width: 48px;
      min-height: 48px;
      padding: 0;
      font-size: 1.5rem;
      color: var(--text);
      background: var(--grid);
      border: 1px solid var(--field);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;       /* тап не вызывает прокрутку/зум */
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad button:active {
      background: var(--accent);
      color: #06210f;
      transform: scale(0.94);
    }

    /* Подсказка по управлению */
    .hint { font-size: 0.85rem; opacity: 0.7; text-align: center; }

    /* ===== Бейдж курса (небольшая плашка внизу) ===== */
    .course-badge {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text);
      text-decoration: none;
      background: var(--field);
      border: 1px solid var(--grid);
      border-radius: 999px;      /* скруглённая «пилюля» */
      padding: 7px 14px;
      opacity: 0.85;
      transition: opacity 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }
    .course-badge:hover {
      opacity: 1;
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .course-badge:active { transform: translateY(0); }

    /* ===== Магазин скинов ===== */
    .shop-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 20, 0.9);
      padding: 16px;
    }
    .shop-overlay.hidden { display: none; }

    .shop-panel {
      width: min(96vw, 460px);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--field);
      border: 1px solid var(--grid);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }
    .shop-panel h2 { font-size: 1.4rem; }
    .shop-balance { font-size: 1.05rem; }
    .shop-balance #shopBalance { color: var(--accent); font-weight: 600; }

    .shop-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .skin-card {
      background: var(--bg);
      border: 2px solid var(--grid);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .skin-card.selected { border-color: var(--accent); }

    /* Превью скина — цветная полоска */
    .skin-swatch {
      width: 100%;
      height: 34px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .skin-name { font-size: 0.82rem; line-height: 1.2; min-height: 2.2em; display: flex; align-items: center; }
    .skin-price { font-size: 0.85rem; opacity: 0.85; display: flex; align-items: center; gap: 4px; }

    /* Кнопка в карточке скина */
    .skin-card button {
      width: 100%;
      font-size: 0.85rem;
      padding: 8px 6px;
      border-radius: 8px;
    }
    .skin-card button.owned {         /* «Выбрать» — вторичная */
      color: var(--text);
      background: var(--grid);
      border: 1px solid var(--field);
    }
    .skin-card button.selected-btn {  /* «Выбрано» — неактивная */
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      cursor: default;
    }
    .skin-card button:disabled { opacity: 0.45; cursor: not-allowed; }

    .coin-icon.small { width: 0.85em; height: 0.85em; }
  </style>
</head>
<body>

  <h1>🐍 Змейка</h1>
  <div class="score">Счёт: <span id="score">0</span> &nbsp;·&nbsp; Рекорд: <span id="best">0</span> &nbsp;·&nbsp; <span class="coin-icon" aria-hidden="true"></span> <span id="coins">0</span></div>

  <div class="field-wrap">
    <!-- Внутреннее разрешение холста = 20 клеток × 24px = 480px.
         На экране он масштабируется через CSS. -->
    <canvas id="game" width="480" height="480"></canvas>

    <!-- Стартовый экран: показывается при загрузке, пока не нажата кнопка -->
    <div class="overlay" id="startOverlay">
      <h2>🐍 Змейка</h2>
      <div class="final-score">Собирай еду и расти. Не врежься в стены и в себя!</div>
      <button id="startBtn">Начать игру</button>
      <button id="shopBtnStart" class="btn-secondary">Магазин скинов</button>
      <button class="btn-secondary mute-btn">Звук: вкл</button>
      <button class="btn-secondary vibro-btn">Вибрация: вкл</button>
    </div>

    <!-- Экран проигрыша: показывается только после Game Over -->
    <div class="overlay hidden" id="overlay">
      <h2>Game Over</h2>
      <div class="final-score">Твой счёт: <span id="finalScore">0</span></div>
      <button id="restart">Начать заново</button>
      <button id="share" class="btn-secondary">📤 Поделиться результатом</button>
      <button id="shopBtnOver" class="btn-secondary">Магазин скинов</button>
      <!-- Сообщение после копирования в буфер (для десктопа без шеринга) -->
      <div class="share-msg" id="shareMsg"></div>
    </div>
  </div>

  <!-- Экранные кнопки-стрелки (крестовина). data-dir = "x,y" направление движения -->
  <div class="dpad" id="dpad">
    <button class="btn-up"    data-dir="0,-1" aria-label="Вверх">▲</button>
    <button class="btn-left"  data-dir="-1,0" aria-label="Влево">◀</button>
    <button class="btn-down"  data-dir="0,1"  aria-label="Вниз">▼</button>
    <button class="btn-right" data-dir="1,0"  aria-label="Вправо">▶</button>
  </div>

  <div class="hint">Управление: стрелки на клавиатуре ← ↑ → ↓, кнопки внизу или свайпы на телефоне</div>

  <!-- Бейдж курса: кликабельная плашка внизу страницы.
       href — сайт курса (замени при необходимости на актуальный адрес). -->
  <a class="course-badge"
     href="https://skillmake.ru/kurs"
     target="_blank" rel="noopener noreferrer">
    🚀 Сделано на курсе «Путь к миллиарду»
  </a>

  <!-- ===== Экран магазина скинов (модальное окно поверх всего) ===== -->
  <div class="shop-overlay hidden" id="shop">
    <div class="shop-panel">
      <h2>Магазин скинов</h2>
      <div class="shop-balance">
        Баланс: <span class="coin-icon" aria-hidden="true"></span> <span id="shopBalance">0</span>
      </div>
      <div class="shop-list" id="shopList"><!-- карточки скинов рисует JS --></div>
      <button class="btn-secondary mute-btn">Звук: вкл</button>
      <button class="btn-secondary vibro-btn">Вибрация: вкл</button>
      <button id="shopClose">Закрыть</button>
    </div>
  </div>

  <!-- Логика магазина/монет — общий модуль для игры и автотестов (npm test) -->
  <script src="shop-logic.js"></script>
  <script>
  // ===================== НАСТРОЙКИ ИГРЫ =====================
  const CELLS = 20;              // поле 20×20 клеток
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const CELL = canvas.width / CELLS; // размер одной клетки в пикселях (480/20 = 24)
  // ⚙️ СКОРОСТЬ ЗМЕЙКИ — меняй это число под себя.
  //    Это интервал между шагами в миллисекундах: БОЛЬШЕ число = МЕДЛЕННЕЕ, меньше = быстрее.
  //    Ориентиры: 120 — быстро, 160 — комфортно (по умолчанию), 220 — спокойно/для новичка.
  const SPEED = 280;

  // 🪙 СКОЛЬКО МОНЕТ ДАВАТЬ ЗА ОДНУ ЕДУ — меняй это число под себя.
  const COINS_PER_FOOD = 1;

  // 🎨 СКИНЫ ЗМЕЙКИ — цены и цвета легко менять здесь.
  //    body/head — цвет тела и головы. Спец-значение 'rainbow' — радужная раскраска по сегментам.
  const SKINS = [
    { id: 'classic', name: 'Классическая зелёная', price: 0,   body: '#4ade80', head: '#22c55e' },
    { id: 'fire',    name: 'Огненная',              price: 10,  body: '#fb923c', head: '#dc2626' },
    { id: 'ice',     name: 'Ледяная',               price: 20,  body: '#7dd3fc', head: '#0ea5e9' },
    { id: 'gold',    name: 'Золотая',               price: 50,  body: '#fde047', head: '#ca8a04' },
    { id: 'rainbow', name: 'Радужная',              price: 75,  body: 'rainbow', head: 'rainbow' },
    { id: 'night',   name: 'Ночная',                price: 100, body: '#818cf8', head: '#a855f7' },
  ];

  // Ключи, под которыми данные хранятся в localStorage браузера
  const BEST_KEY = 'snakeBestScore';
  const COINS_KEY = 'snakeCoins';
  const OWNED_KEY = 'snakeOwnedSkins';   // список купленных скинов (JSON-массив id)
  const SELECTED_KEY = 'snakeSelectedSkin'; // id выбранного скина

  // Секретная «соль» для контрольной суммы монет. Не криптография —
  // просто чтобы случайная правка монет в консоли не прошла проверку.
  const COINS_SALT = 'snk_2026_x9f3';

  // Элементы интерфейса
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const coinsEl = document.getElementById('coins');
  const finalScoreEl = document.getElementById('finalScore');
  const overlay = document.getElementById('overlay');
  const restartBtn = document.getElementById('restart');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  // Читаем рекорд из localStorage (если его нет — 0). Number() превращает строку в число.
  let best = Number(localStorage.getItem(BEST_KEY)) || 0;

  // ---- Монеты с защитой от ручной подделки (логика — в ShopLogic) ----
  // Сохраняем монеты в формате "значение|контрольная_сумма"
  function saveCoins() {
    localStorage.setItem(COINS_KEY, ShopLogic.encodeCoins(coins, COINS_SALT));
  }
  // Читаем и проверяем. Если формат сломан или сумма не сходится — вернётся 0.
  function loadCoins() {
    return ShopLogic.decodeCoins(localStorage.getItem(COINS_KEY), COINS_SALT);
  }

  // Монеты — накопительный итог: сохраняются между играми и после перезагрузки.
  let coins = loadCoins();

  // Купленные скины (классический всегда бесплатный и уже куплен)
  let ownedSkins;
  try { ownedSkins = JSON.parse(localStorage.getItem(OWNED_KEY)) || ['classic']; }
  catch (e) { ownedSkins = ['classic']; }
  if (!ownedSkins.includes('classic')) ownedSkins.push('classic');

  // Выбранный скин (по умолчанию — классический)
  let selectedSkin = localStorage.getItem(SELECTED_KEY) || 'classic';

  // ===================== ЗВУК (Web Audio, генерируем в коде) =====================
  const MUTED_KEY = 'snakeMuted';
  let muted = localStorage.getItem(MUTED_KEY) === '1'; // выключен ли звук
  let audioCtx = null;

  // Готовим/возвращаем аудио-контекст. Если звук выключен — не создаём и не играем.
  function getAudio() {
    if (muted) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;               // браузер без Web Audio — просто без звука
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume(); // разблокировка после клика
    return audioCtx;
  }

  // Один тон: частота (Гц), длительность (мс), форма волны, громкость, задержка старта (с)
  function tone(freq, durationMs, type, volume, startDelay) {
    const ctx = getAudio();
    if (!ctx) return; // звук выключен или не поддерживается — тихо выходим
    const t0 = ctx.currentTime + (startDelay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);       // быстрый нарастание
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durationMs / 1000); // затухание
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + durationMs / 1000 + 0.03);
  }

  // Звук поедания еды — короткий приятный восходящий «блип»
  function playEat() {
    tone(660, 90, 'sine', 0.18, 0);
    tone(880, 90, 'sine', 0.14, 0.05);
  }
  // Звук Game Over — низкая драматичная нисходящая последовательность
  function playGameOver() {
    tone(300, 220, 'sawtooth', 0.2, 0);
    tone(220, 260, 'sawtooth', 0.2, 0.18);
    tone(150, 420, 'sawtooth', 0.2, 0.4);
  }
  // Звук покупки — яркий «ча-динг» (звон монет)
  function playPurchase() {
    tone(880, 120, 'triangle', 0.2, 0);
    tone(1320, 220, 'triangle', 0.2, 0.1);
  }

  // ===================== ВИБРАЦИЯ (haptics для мобильных) =====================
  const VIBRO_KEY = 'snakeVibro';
  let vibroOn = localStorage.getItem(VIBRO_KEY) !== '0'; // по умолчанию включена

  // Безопасная вибрация: если выключена или устройство не поддерживает — тихо выходим.
  // pattern — число (мс) или массив [вибро, пауза, вибро, ...].
  function vibrate(pattern) {
    if (!vibroOn) return;
    if (typeof navigator === 'undefined' || typeof navigator.vibrate !== 'function') return; // ПК/iOS — нет API
    try { navigator.vibrate(pattern); } catch (e) { /* на всякий случай не роняем игру */ }
  }

  // ===================== СОСТОЯНИЕ ИГРЫ =====================
  let snake;        // массив сегментов змейки, [0] — голова. Каждый сегмент = {x, y}
  let food;         // координаты еды {x, y}
  let dir;          // текущее направление движения {x, y}
  let nextDir;      // направление на следующий шаг (защита от разворота в одном кадре)
  let score;        // счёт
  let gameOver;     // флаг конца игры
  let timer;        // ссылка на игровой цикл (setInterval)

  // ===================== ПОДГОТОВКА ПОЛЯ (без запуска движения) =====================
  // Расставляет змейку и еду, рисует стартовую картинку, но НЕ запускает таймер.
  function resetBoard() {
    // Змейка из 3 сегментов в центре поля, смотрит вправо
    const c = Math.floor(CELLS / 2); // центр (10)
    snake = [
      { x: c,     y: c }, // голова
      { x: c - 1, y: c },
      { x: c - 2, y: c }, // хвост
    ];
    dir = { x: 1, y: 0 };     // движемся вправо
    nextDir = { x: 1, y: 0 };
    score = 0;
    gameOver = false;
    scoreEl.textContent = score;
    bestEl.textContent = best;       // показываем текущий рекорд
    coinsEl.textContent = coins;     // монеты НЕ сбрасываем — просто показываем накопленное
    overlay.classList.add('hidden'); // прячем экран проигрыша

    placeFood();  // ставим первую еду
    clearInterval(timer); // на всякий случай останавливаем прошлый цикл
    draw();       // рисуем стартовую позицию (змейка стоит на месте)
  }

  // ===================== ЗАПУСК ДВИЖЕНИЯ =====================
  // Прячет стартовый экран и включает игровой цикл.
  function startGame() {
    startOverlay.classList.add('hidden'); // убираем экран со стартовой кнопкой
    getAudio();                           // разблокируем звук в рамках клика
    clearInterval(timer);
    timer = setInterval(step, SPEED);
  }

  // ===================== ЕДА =====================
  // Ставит еду в случайную свободную клетку (не на теле змейки)
  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
    } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y)); // повторяем, если попали на змейку
    food = pos;
  }

  // ===================== ОДИН ШАГ ИГРЫ =====================
  function step() {
    if (gameOver) return;

    dir = nextDir; // применяем выбранное направление

    // Новая голова = старая голова + направление
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Проверка 6: врезание в стену → Game Over
    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
      return endGame();
    }

    // Проверка 7: врезание в себя → Game Over
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      return endGame();
    }

    // Двигаем змейку: добавляем новую голову вперёд
    snake.unshift(head);

    // Проверка 4: съели еду?
    if (head.x === food.x && head.y === food.y) {
      score++;                     // счёт +1
      scoreEl.textContent = score;

      // Монеты: +COINS_PER_FOOD и сразу сохраняем (с контрольной суммой)
      coins += COINS_PER_FOOD;
      coinsEl.textContent = coins;
      saveCoins();

      playEat();                   // звук поедания
      vibrate(30);                 // короткая вибрация
      placeFood();                 // новая еда (змейка выросла — хвост НЕ убираем)
    } else {
      snake.pop();                 // не ели — убираем хвост (длина не меняется)
    }

    draw();
  }

  // ===================== КОНЕЦ ИГРЫ =====================
  function endGame() {
    gameOver = true;
    clearInterval(timer);
    playGameOver();                // драматичный звук проигрыша
    vibrate([120, 50, 180]);       // более длинная вибрация проигрыша
    finalScoreEl.textContent = score;

    // Сравниваем счёт с рекордом. Если побили — сохраняем новый рекорд в localStorage.
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, best); // запись переживёт перезагрузку страницы
      bestEl.textContent = best;            // обновляем рекорд на экране
    }

    overlay.classList.remove('hidden'); // показываем экран со счётом и кнопкой
  }

  // ===================== ОТРИСОВКА =====================
  function draw() {
    // Очищаем поле
    ctx.fillStyle = getCss('--field');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Рисуем сетку (тонкие линии)
    ctx.strokeStyle = getCss('--grid');
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // Рисуем еду (кружок)
    drawCircle(food.x, food.y, getCss('--food'));

    // Рисуем змейку в цветах выбранного скина (голова ярче тела)
    const skin = ShopLogic.activeSkin(SKINS, selectedSkin);
    snake.forEach((seg, index) => {
      let color;
      if (skin.body === 'rainbow') {
        // Радужный скин: каждый сегмент — свой оттенок
        const hue = (index * 22) % 360;
        color = `hsl(${hue}, 80%, ${index === 0 ? 55 : 62}%)`;
      } else {
        color = index === 0 ? skin.head : skin.body;
      }
      ctx.fillStyle = color;
      roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 5);
    });
  }

  // Вспомогательное: клетка со скруглёнными углами
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  // Вспомогательное: круг в центре клетки (для еды)
  function drawCircle(cx, cy, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx * CELL + CELL / 2, cy * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Вспомогательное: берём цвет из CSS-переменных
  function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // ===================== УПРАВЛЕНИЕ КЛАВИАТУРОЙ =====================
  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp':    setDir(0, -1); break;
      case 'ArrowDown':  setDir(0,  1); break;
      case 'ArrowLeft':  setDir(-1, 0); break;
      case 'ArrowRight': setDir(1,  0); break;
      default: return;
    }
    e.preventDefault(); // чтобы стрелки не скроллили страницу
  });

  // Меняем направление, запрещая разворот на 180° (иначе змейка врежется в себя)
  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // это разворот назад — игнорируем
    nextDir = { x, y };
  }

  // ===================== УПРАВЛЕНИЕ СВАЙПАМИ (для телефона) =====================
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    // Определяем, куда был свайп сильнее — по горизонтали или вертикали
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  });

  // ===================== УПРАВЛЕНИЕ ЭКРАННЫМИ КНОПКАМИ =====================
  // Один обработчик на всю крестовину. pointerdown срабатывает мгновенно
  // и на мышке, и на тапе пальцем.
  document.getElementById('dpad').addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button[data-dir]');
    if (!btn) return;
    e.preventDefault(); // без задержки и без «увода» фокуса на кнопку
    const [x, y] = btn.dataset.dir.split(',').map(Number);
    setDir(x, y); // та же логика, что у стрелок и свайпов
  });

  // Кнопка «Начать игру» на стартовом экране — запускает движение
  startBtn.addEventListener('click', () => {
    resetBoard();  // свежая позиция
    startGame();   // поехали
  });

  // Кнопка «Начать заново» после Game Over — сразу новая игра
  restartBtn.addEventListener('click', () => {
    resetBoard();
    startGame();
  });

  // ===================== ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ =====================
  const shareBtn = document.getElementById('share');
  const shareMsg = document.getElementById('shareMsg');
  let msgTimer;

  // Собираем текст: счёт + ссылка на игру.
  // location.origin + pathname даёт чистый адрес игры (на Pages — .../snake-game/).
  function buildShareText() {
    const url = location.origin + location.pathname;
    return `Я набрал ${score} очков в Змейке! Сможешь больше? ${url}`;
  }

  // Показать сообщение и через пару секунд спрятать
  function showShareMsg(text) {
    shareMsg.textContent = text;
    shareMsg.classList.add('show');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => shareMsg.classList.remove('show'), 2500);
  }

  // Фолбэк: копируем текст в буфер обмена
  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      showShareMsg('Скопировано! Отправь другу');
    } catch (e) {
      // Запасной способ для старых браузеров
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showShareMsg('Скопировано! Отправь другу');
      } catch (_) {
        showShareMsg('Не удалось скопировать');
      }
      document.body.removeChild(ta);
    }
  }

  // Телефон это или компьютер? На телефоне удобнее системное окно шеринга,
  // на компьютере — копирование в буфер.
  function isMobile() {
    if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
      return navigator.userAgentData.mobile;
    }
    return /Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i.test(navigator.userAgent);
  }

  shareBtn.addEventListener('click', () => {
    const text = buildShareText();

    // ТЕЛЕФОН + есть системный шеринг → открываем родное окно «Поделиться»
    if (isMobile() && navigator.share) {
      navigator.share({ title: 'Змейка', text: text }).catch((err) => {
        // Отмена пользователем — ничего; иначе копируем как запасной вариант
        if (!err || err.name !== 'AbortError') copyToClipboard(text);
      });
      return;
    }

    // КОМПЬЮТЕР (или нет системного шеринга) → сразу копируем в буфер,
    // прямо в рамках клика, чтобы браузер разрешил доступ к буферу.
    copyToClipboard(text);
  });

  // ===================== МАГАЗИН СКИНОВ =====================
  const shop = document.getElementById('shop');
  const shopList = document.getElementById('shopList');
  const shopBalanceEl = document.getElementById('shopBalance');
  const shopClose = document.getElementById('shopClose');
  const shopBtnStart = document.getElementById('shopBtnStart');
  const shopBtnOver = document.getElementById('shopBtnOver');

  // CSS-превью скина (цветная полоска для карточки)
  function skinPreviewCss(skin) {
    if (skin.body === 'rainbow') {
      return 'linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#38bdf8,#a855f7)';
    }
    return `linear-gradient(135deg, ${skin.head}, ${skin.body})`;
  }

  // Сохраняем купленные и выбранный скин в localStorage
  function saveSkins() {
    localStorage.setItem(OWNED_KEY, JSON.stringify(ownedSkins));
    localStorage.setItem(SELECTED_KEY, selectedSkin);
  }

  // Рисуем карточки всех скинов
  function renderShop() {
    shopBalanceEl.textContent = coins;
    shopList.innerHTML = '';
    SKINS.forEach((skin) => {
      const owned = ownedSkins.includes(skin.id);
      const isSelected = selectedSkin === skin.id;

      const card = document.createElement('div');
      card.className = 'skin-card' + (isSelected ? ' selected' : '');

      const swatch = document.createElement('div');
      swatch.className = 'skin-swatch';
      swatch.style.background = skinPreviewCss(skin);
      card.appendChild(swatch);

      const name = document.createElement('div');
      name.className = 'skin-name';
      name.textContent = skin.name;
      card.appendChild(name);

      const price = document.createElement('div');
      price.className = 'skin-price';
      price.innerHTML = skin.price === 0
        ? 'Бесплатно'
        : '<span class="coin-icon small" aria-hidden="true"></span> ' + skin.price;
      card.appendChild(price);

      const btn = document.createElement('button');
      if (isSelected) {
        btn.textContent = '✓ Выбрано';
        btn.className = 'selected-btn';
        btn.disabled = true;
      } else if (owned) {
        btn.textContent = 'Выбрать';
        btn.className = 'owned';
        btn.addEventListener('click', () => selectSkin(skin.id));
      } else {
        btn.textContent = 'Купить';
        if (coins < skin.price) btn.disabled = true; // не хватает монет
        btn.addEventListener('click', () => buySkin(skin));
      }
      card.appendChild(btn);
      shopList.appendChild(card);
    });
  }

  // Текущее состояние игрока для ShopLogic
  function playerState() {
    return { coins: coins, owned: ownedSkins, selected: selectedSkin };
  }

  // Выбрать уже купленный скин (правило — в ShopLogic.select)
  function selectSkin(id) {
    const res = ShopLogic.select(playerState(), id);
    if (!res.ok) return;
    selectedSkin = res.state.selected;
    saveSkins();
    renderShop();
    draw(); // сразу перекрашиваем змейку на поле
  }

  // Купить скин (правило — в ShopLogic.buy)
  function buySkin(skin) {
    const res = ShopLogic.buy(playerState(), skin);
    if (!res.ok) return;              // не хватает монет или уже куплен
    playPurchase();                   // звон монет
    vibrate([20, 30, 20]);            // вибрация покупки
    coins = res.state.coins;
    ownedSkins = res.state.owned;
    selectedSkin = res.state.selected; // купил — сразу применяем
    saveCoins();                       // сохраняем баланс с контрольной суммой
    coinsEl.textContent = coins;       // обновляем баланс на главном экране
    saveSkins();
    renderShop();
    draw();
  }

  function openShop() { renderShop(); shop.classList.remove('hidden'); }
  function closeShop() { shop.classList.add('hidden'); }

  shopBtnStart.addEventListener('click', openShop);
  shopBtnOver.addEventListener('click', openShop);
  shopClose.addEventListener('click', closeShop);

  // ===================== ПЕРЕКЛЮЧАТЕЛЬ ЗВУКА (MUTE) =====================
  const muteBtns = document.querySelectorAll('.mute-btn');

  // Обновляем подпись на всех кнопках mute
  function updateMuteBtns() {
    muteBtns.forEach((b) => { b.textContent = muted ? 'Звук: выкл' : 'Звук: вкл'; });
  }

  function setMute(m) {
    muted = m;
    localStorage.setItem(MUTED_KEY, m ? '1' : '0'); // сохраняем состояние
    updateMuteBtns();
    if (!muted) getAudio(); // включили звук по клику — сразу разблокируем контекст
  }

  muteBtns.forEach((b) => b.addEventListener('click', () => setMute(!muted)));
  updateMuteBtns(); // показать актуальное состояние при загрузке

  // ===================== ПЕРЕКЛЮЧАТЕЛЬ ВИБРАЦИИ =====================
  const vibroBtns = document.querySelectorAll('.vibro-btn');

  function updateVibroBtns() {
    vibroBtns.forEach((b) => { b.textContent = vibroOn ? 'Вибрация: вкл' : 'Вибрация: выкл'; });
  }

  function setVibro(on) {
    vibroOn = on;
    localStorage.setItem(VIBRO_KEY, on ? '1' : '0'); // сохраняем состояние
    updateVibroBtns();
    if (vibroOn) vibrate(20); // включили — коротко «дзинь» как подтверждение (на мобильном)
  }

  vibroBtns.forEach((b) => b.addEventListener('click', () => setVibro(!vibroOn)));
  updateVibroBtns();

  // ===================== СТАРТ =====================
  // При загрузке только готовим поле и показываем стартовый экран.
  // Движение начнётся, когда игрок нажмёт «Начать игру».
  resetBoard();

  // ===================== РЕГИСТРАЦИЯ SERVICE WORKER (PWA) =====================
  // Включает офлайн-режим и делает игру устанавливаемой на телефон.
  // Путь относительный — работает и на GitHub Pages в подпапке /snake-game/.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('Service worker зарегистрирован:', reg.scope))
        .catch(err => console.warn('Service worker не зарегистрировался:', err));
    });
  }
  </script>
</body>
</html>
